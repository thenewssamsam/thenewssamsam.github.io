title: Beyond The News Sam
description: AI-powered commentary on global news from a faith perspective
url: "https://thenewssamsam.github.io"
baseurl: ""

# Theme
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Markdown processor
markdown: kramdown

# Timezone
timezone: Asia/Taipei

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - .github/
