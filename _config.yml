title: Beyond The News Sam
description: AI-powered commentary on global news from a faith perspective
url: "https://thenewssamsam.github.io"
baseurl: ""

# PWA Configuration
pwa:
  service_worker: true
  theme_color: "#2563eb"
  background_color: "#ffffff"
  display: standalone

# Theme
theme: minima
plugins:
  - jekyll-feed
  # - jekyll-seo-tag  # Disabled: might be causing duplicate meta tags
  # - jekyll-sitemap  # Disabled: using custom generate_sitemap.py instead

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Markdown processor
markdown: kramdown

# Timezone
timezone: Asia/Taipei

# Performance optimization for faster builds
# Build settings
strict_front_matter: true
liquid:
  error_mode: strict
  strict_filters: true
  strict_variables: true

# Exclude files to speed up build
exclude:
  - Gemfile
  - Gemfile.lock
  - .github/
  - venv/
  - venv_new/
  - node_modules/
  - .DS_Store
  - batch_progress.json
  - sitemap.txt
  - generate_hugo_sitemap.py
  - bluesky_publisher.py
  - batch_publish_news.py
  - publisher_github.py
  - quality_control.py
  - *.log
  - *.json
  - _posts/*.log
