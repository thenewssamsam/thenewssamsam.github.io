title: Beyond The News Sam
description: AI-powered commentary on global news from a faith perspective
url: "https://johnthenews.netlify.app"
baseurl: ""

# Theme (disabled to use custom layouts)
# theme: minima
plugins:
  - jekyll-feed
  - jekyll-paginate

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Markdown processor
markdown: kramdown

# Timezone
timezone: "Asia/Taipei"

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - .github/
  - venv/
  - venv_new/
  - node_modules/
  - .DS_Store
