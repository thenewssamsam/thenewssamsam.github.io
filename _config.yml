title: Beyond The News Sam
description: AI-powered commentary on global news from a faith perspective
url: "https://thenewssamsam.github.io"
baseurl: ""

# PWA Configuration
pwa:
  service_worker: true
  theme_color: "#2563eb"
  background_color: "#ffffff"
  display: standalone

# Theme
theme: minima
plugins:
  - jekyll-feed
  # - jekyll-seo-tag  # Disabled: might be causing duplicate meta tags
  # - jekyll-sitemap  # Disabled: using custom generate_sitemap.py instead

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Markdown processor
markdown: kramdown

# Timezone
timezone: Asia/Taipei

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - .github/
