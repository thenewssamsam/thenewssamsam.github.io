name: Auto-Publish Articles

on:
  schedule:
    # 每天下午 2 點（UTC+8 = 08:00 UTC）
    - cron: '0 6 * * *'
  workflow_dispatch:  # 手動觸發

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml trafilatura google-genai python-dotenv
      
      - name: Run article generation and publication
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python /Users/yanyaosheng/Desktop/temp/yenyaosam_kiro/beyondthenewssam/main_github.py
      
      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
      
      - name: Commit and push changes
        run: |
          git add _posts/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-publish articles [$(date +'%Y-%m-%d %H:%M:%S')]"
            git push
          fi
